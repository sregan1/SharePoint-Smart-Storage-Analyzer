name: Release

# Fires on the tag push itself, so `git push origin vX.Y.Z` is the whole release
# process — no manual "create release" step to forget.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.17.1'
          cache: 'npm'

      - name: Install gulp-cli
        run: npm install -g gulp-cli

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run ship

      - name: Extract this version's CHANGELOG section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1      { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found                    { print }
          ' CHANGELOG.md > changelog-section.md
          sed -i -e 's/^---$//' changelog-section.md
          if [ ! -s changelog-section.md ] || ! grep -q '[^[:space:]]' changelog-section.md; then
            echo "No CHANGELOG.md section found for [$VERSION]" >&2
            exit 1
          fi

      - name: Build release notes
        run: |
          {
            echo "## Installation"
            echo ""
            echo "1. Download \`smart-storage-analyzer.sppkg\`"
            echo "2. Upload to your SharePoint App Catalog"
            echo "3. Deploy tenant-wide or to specific sites"
            echo ""
          } > release-notes.md
          cat changelog-section.md >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sharepoint/solution/smart-storage-analyzer.sppkg
          body_path: release-notes.md
