name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.17.1'

      - name: Install dependencies
        run: npm ci

      - name: Build release package
        run: |
          npx gulp clean
          npm run ship

      - name: Locate .sppkg
        id: sppkg
        run: |
          PKG=$(find sharepoint/solution -maxdepth 1 -name '*.sppkg' | head -n1)
          if [ -z "$PKG" ]; then
            echo "No .sppkg found under sharepoint/solution" >&2
            exit 1
          fi
          echo "path=$PKG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sppkg.outputs.path }}
          generate_release_notes: true
